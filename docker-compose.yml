# =================================================
# Docker Compose - Open API Facturación SRI (Development)
# =================================================
# Usage: docker compose up -d --build
#
# This file includes:
#  - PostgreSQL 14 (database)
#  - Redis 7 (cache + BullMQ)
#  - Open API Facturación SRI (NestJS)
#
# Copy .env.example to .env.docker and customize.

services:
  # ─── Carbone.io (Generación de PDFs) ───
  carbone:
    image: carbone/carbone-ee:latest
    container_name: open-api-carbone
    restart: unless-stopped
    environment:
      - CARBONE_EE_STUDIO=true
    ports:
      - '${CARBONE_PORT:-4000}:4000'
    volumes:
      - ${HOST_TEMPLATES_PATH:-../templates}:/app/template
    healthcheck:
      test: ['CMD-SHELL', 'bash -c "echo > /dev/tcp/localhost/4000"']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: 'json-file'
      options:
        max-size: '5m'
        max-file: '2'
    networks:
      - open-api-network

  # ─── Redis (BullMQ + Cache) ───
  redis:
    image: redis:7-alpine
    container_name: open-api-redis
    restart: unless-stopped
    command: >
      /bin/sh -c '
      if [ -n "${REDIS_PASSWORD:-}" ]; then
        exec redis-server --requirepass "${REDIS_PASSWORD}" --maxmemory 256mb --maxmemory-policy noeviction --appendonly yes
      else
        exec redis-server --maxmemory 256mb --maxmemory-policy noeviction --appendonly yes
      fi
      '
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 3
    logging:
      driver: 'json-file'
      options:
        max-size: '5m'
        max-file: '2'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - open-api-network


  # ─── Open API Facturación SRI ───
  open-api-facturacion-sri:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: open-api-facturacion-sri
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      # Database
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-db_sri}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres123}

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      # Carbone API dentro del compose network
      CARBONE_API: http://carbone:4000

    # Port mapping
    ports:
      - '${PORT:-3001}:3001'

    # Volume mounts for persistent data
    volumes:
      - ${HOST_TEMPLATES_PATH:-./templates}:/data/templates
      - ${HOST_PDFS_PATH:-./pdfs}:/data/pdfs
      - ${HOST_CERTS_PATH:-./certs}:/data/certs
      - ${HOST_XMLS_PATH:-./xmls}:/data/xmls

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      carbone:
        condition: service_healthy

    # Health check
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--no-verbose',
          '--tries=1',
          '--spider',
          'http://localhost:3001/status',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

    # Logging
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      - open-api-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  open-api-network:
    driver: bridge

